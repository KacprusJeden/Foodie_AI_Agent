[project]
name = "foodie-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "KacprusJeden", email = "kacper050710@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-maps-places>=0.9.1",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-google-community[places]>=5.1.1",
    "langchain-openai>=1.7.0",
    "pytest>=9.1.1",
]

[project.scripts]
foodie-ai-agent = "foodie_ai_agent:main"
foodie-ai-pytest = "foodie_ai_agent.test_runner:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["*_UT.py"]
